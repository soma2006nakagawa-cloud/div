<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>全モデル表示テスト | しばコレ</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Yu Gothic",system-ui,sans-serif}
#debug{position:fixed;top:10px;left:10px;right:10px;z-index:9999;max-height:42vh;overflow:auto;padding:10px;border-radius:10px;background:rgba(0,0,0,.74);color:#75ff75;font-size:12px;line-height:1.4;white-space:pre-line;pointer-events:none}
#back{position:fixed;right:10px;bottom:12px;z-index:9999}
#back a{display:block;border-radius:10px;padding:11px 15px;background:#4c9a25;color:#fff;text-decoration:none;font-size:14px;font-weight:bold}
</style>
</head>
<body>
<div id="debug">GPS取得待機中...</div>
<div id="back"><a href="index.html">← ホーム</a></div>

<a-scene id="scene" vr-mode-ui="enabled:false" embedded arjs="sourceType:webcam;gpsMinDistance:0;gpsTimeInterval:1000;debugUIEnabled:false;">
  <a-camera gps-camera rotation-reader camera="far:10000;near:0.1"></a-camera>
</a-scene>

<script>
const ACTIVE_RADIUS=300;
const MODEL_GAP=12;
const DISPLAY_HEIGHT=2;

const testAreas=[
  {id:"college",name:"職能短大",lat:37.955482,lng:139.338409},
  {id:"uoroku-midori",name:"ウオロク緑店",lat:37.95615497972688,lng:139.33351331568522}
];

const testModels=[
  {id:"castle",name:"新発田城",model:"shibata_jyo.glb"},
  {id:"zousyunkaku",name:"蔵春閣",model:"Zousyunkaku.glb"},
  {id:"sl",name:"東公園のSL",model:"SL.glb"},
  {id:"oumon",name:"王紋酒造",model:"Oumon.glb"},
  {id:"station",name:"新発田駅",model:"shibata_station.glb"},
  {id:"menchi",name:"藤倉メンチカツや",model:"Menchikatsu.glb"},
  {id:"hellotore",name:"ハロトレくん",model:"hellotore_kun.glb"},
  {id:"ayamenoyu",name:"あやめの湯",model:"ayamenoyu.glb"},
  {id:"ikunesu",name:"イクネスしばた",model:"ikunesu_shibata_building.glb"},
  {id:"culture-center",name:"カルチャーセンター",model:"culture_center.glb"},
  {id:"parlor-yaoya",name:"パーラーやお家",model:"parlor_yaoya.glb"},
  {id:"bontakeda",name:"ボン・タケダ",model:"bontakeda_shibata.glb"},
  {id:"ino",name:"文化洋食ino",model:"ino.glb"},
  {id:"yasuke",name:"やすけカレー",model:"yasuke.glb"},
  {id:"kamajo",name:"レストラン蒲城",model:"restaurant_kamajo.glb"},
  {id:"kikusui",name:"菊水",model:"kikusui_funaguchi_final.glb"},
  {id:"ijimino",name:"五十公野公園",model:"ijimino_park.glb"},
  {id:"fukiyakoji",name:"蕗谷虹児記念館",model:"fukiyakoji.glb"},
  {id:"suwa",name:"諏訪神社",model:"shibata_suwa_shrine_gate.glb"},
  {id:"rengaya",name:"コーヒーマリーナ煉瓦屋",model:"rengaya.glb"},
  {id:"history-library",name:"新発田歴史図書館",model:"history_library.glb"}
];

const debug=document.getElementById("debug");
const scene=document.getElementById("scene");
const entities=new Map();
const states=new Map();
let activeAreaId=null;

function rad(value){return value*Math.PI/180}
function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000,dLat=rad(lat2-lat1),dLng=rad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function offsetCoordinate(centerLat,centerLng,eastMeters,northMeters){
  return {
    lat:centerLat+northMeters/111320,
    lng:centerLng+eastMeters/(111320*Math.cos(rad(centerLat)))
  };
}

function removeModels(){
  entities.forEach(entity=>entity.remove());
  entities.clear();
  states.clear();
  activeAreaId=null;
}

function createAllModels(area){
  if(activeAreaId===area.id&&entities.size===testModels.length)return;
  removeModels();
  activeAreaId=area.id;
  const columns=5;

  testModels.forEach((item,index)=>{
    const row=Math.floor(index/columns);
    const column=index%columns;
    const east=(column-(columns-1)/2)*MODEL_GAP;
    const north=(2-row)*MODEL_GAP;
    const point=offsetCoordinate(area.lat,area.lng,east,north);
    const entity=document.createElement("a-entity");
    entity.setAttribute("gps-entity-place",`latitude:${point.lat}; longitude:${point.lng};`);
    entity.setAttribute("gltf-model",item.model);
    entity.setAttribute("scale","1 1 1");
    entity.setAttribute("position",`0 ${DISPLAY_HEIGHT} 0`);
    entity.setAttribute("rotation","0 180 0");
    states.set(item.id,"読込中");
    entity.addEventListener("model-loaded",()=>states.set(item.id,"表示中"));
    entity.addEventListener("model-error",error=>{
      states.set(item.id,"失敗");
      console.error(item.name,error.detail);
    });
    scene.appendChild(entity);
    entities.set(item.id,entity);
  });
}

navigator.geolocation.watchPosition(position=>{
  const {latitude:lat,longitude:lng,accuracy}=position.coords;
  const areaDistances=testAreas.map(area=>({
    area,
    distance:distanceMeters(lat,lng,area.lat,area.lng)
  })).sort((a,b)=>a.distance-b.distance);
  const nearest=areaDistances[0];

  if(nearest.distance<=ACTIVE_RADIUS)createAllModels(nearest.area);
  else removeModels();

  const loaded=[...states.values()].filter(state=>state==="表示中").length;
  const failed=[...states.values()].filter(state=>state==="失敗").length;
  const loading=[...states.values()].filter(state=>state==="読込中").length;
  const collegeDistance=areaDistances.find(item=>item.area.id==="college").distance;
  const uorokuDistance=areaDistances.find(item=>item.area.id==="uoroku-midori").distance;
  debug.textContent=`全21モデル表示テスト
現在位置：${lat.toFixed(8)}, ${lng.toFixed(8)}
GPS精度：${accuracy.toFixed(1)}m
職能短大まで：約${collegeDistance.toFixed(1)}m
ウオロク緑店まで：約${uorokuDistance.toFixed(1)}m

${nearest.distance<=ACTIVE_RADIUS
  ? `${nearest.area.name}を中心に12m間隔で配置\n表示中：${loaded}／21　読込中：${loading}　失敗：${failed}`
  : "どちらかの地点から300m以内に入ると、全モデルを表示します"}`;
},error=>{
  debug.textContent=`位置情報エラー\n${error.message}`;
},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
</script>
</body>
</html>
