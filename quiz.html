<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>クイズ | しばコレ</title>
    <link rel="stylesheet" href="quiz.css">
    <link rel="stylesheet" href="app-ui.css">
</head>
<body class="shibakore-page">
    <header class="page-header">
      <a class="back-button" href="game.html" aria-label="クイズマップへ戻る">‹</a>
      <p>しばコレ</p>
      <h1>スポットクイズ</h1>
    </header>
    <main class="quiz-page">
    <div class="quiz-container">
        <h2 id="title">〇×クイズ</h2>
        <div id="quizBox"></div>
        <div class="buttons">
            <button class="btn-true" onclick="answer(true)">〇</button>
            <button class="btn-false" onclick="answer(false)">×</button>
        </div>
        <p id="result"></p>
        <p id="explanation"></p>
    </div>
    <div id="scoreScreen" class="hidden">
        <h2>結果発表</h2>
        <p id="scoreText"></p>
        <a href="game.html">← クイズマップに戻る</a>
    </div>
    </main>
    <script src="quiz.js"></script>
    <script src="app-ui.js"></script>
</body>
</html>
