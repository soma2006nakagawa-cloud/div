#debug{position:fixed;top:10px;left:10px;right:10px;z-index:9999;padding:10px;border-radius:8px;background:rgba(0,0,0,.72);color:#0f0;font-size:13px;line-height:1.45;white-space:pre-line;pointer-events:none}

#back button{border:none;border-radius:10px;padding:11px 15px;background:#1976d2;color:#fff;font-size:14px;font-weight:bold}

<body>

</a-scene>

<script src="collection-data.js"></script>
<script src="collection-tracker.js"></script>
<script>
const debug=document.getElementById("debug");
const spots=[
{id:"castle",name:"新発田城",lat:37.954824724542696,lng:139.326001834219947,model:"shibata_jyo.glb",scale:"1 1 1"},
{id:"zousyunkaku",name:"蔵春閣",lat:37.94389807273562,lng:139.3317142467578,model:"Zousyunkaku.glb",scale:"1 1 1"},
{id:"sl",name:"東公園のSL",lat:37.94367248807764,lng:139.3323475293261,model:"SL.glb",scale:"1 1 1"},
{id:"oumon",name:"王紋酒造",lat:37.94436989072327,lng:139.33066511399528,model:"Oumon.glb",scale:"1 1 1"},
{id:"station",name:"新発田駅",lat:37.94413,lng:139.33510,model:"shibata_station.glb",scale:"1 1 1"},
{id:"menchi",name:"五十公野メンチカツや",lat:37.93682,lng:139.34488,model:"Menchikatsu.glb",scale:"1 1 1"},
{id:"hellotore",name:"新潟職業能力開発短期大学校",lat:37.955482,lng:139.338409,model:"hellotore_kun.glb",scale:"1 1 1"},
{id:"ayamenoyu",name:"あやめの湯",lat:37.953545,lng:139.354947,model:"ayamenoyu.glb",scale:"1 1 1"},
{id:"ikunesu",name:"イクネスしばた",lat:37.944357,lng:139.333388,model:"ikunesu_shibata_building.glb",scale:"1 1 1"},
{id:"culture-center",name:"カルチャーセンター",lat:37.950246,lng:139.338618,model:"culture_center.glb",scale:"1 1 1"},
{id:"parlor-yaoya",name:"パーラーやお家",lat:37.958090796262155,lng:139.34239931165678,model:"parlor_yaoya.glb",scale:"1 1 1"},
{id:"bontakeda",name:"ボン・タケダ",lat:37.94039,lng:139.33600,model:"bontakeda_shibata.glb",scale:"1 1 1"},
{id:"ino",name:"文化洋食ino",lat:37.96236411397717,lng:139.33428189358867,model:"ino.glb",scale:"1 1 1"},
{id:"yasuke",name:"やすけカレー",lat:37.93774827263629,lng:139.33615892651278,model:"yasuke.glb",scale:"1 1 1"},
{id:"kamajo",name:"レストラン蒲城",lat:37.9504968436357,lng:139.339474708348,model:"restaurant_kamajo.glb",scale:"1 1 1"},
{id:"kikusui",name:"菊水",lat:37.960376479226,lng:139.35429135822383,model:"kikusui_funaguchi_final.glb",scale:"1 1 1"},
{id:"ijimino",name:"五十公野公園",lat:37.939869,lng:139.356680,model:"ijimino_park.glb",scale:"1 1 1"},
{id:"fukiyakoji",name:"蕗谷虹児記念館",lat:37.951780,lng:139.327276,model:"fukiyakoji.glb",scale:"1 1 1"},
{id:"suwa",name:"諏訪神社",lat:37.944214,lng:139.332004,model:"shibata_suwa_shrine_gate.glb",scale:"1 1 1"},
{id:"rengaya",name:"コーヒーマリーナ煉瓦屋",lat:37.9490054,lng:139.3244045,model:"rengaya.glb",scale:"1 1 1"},
{id:"history-library",name:"新発田歴史図書館",lat:37.951279909157336,lng:139.32774756292181,model:"history_library.glb",scale:"1 1 1"}
];

const ACTIVE_RADIUS=300;
const states=new Map();

spots.forEach(spot=>{
 const entity=document.getElementById(`model-${spot.id}`);
 states.set(spot.id,"待機中");
 entity.addEventListener("model-loaded",()=>states.set(spot.id,"読込成功"));
 entity.addEventListener("model-error",e=>{states.set(spot.id,"読込失敗");console.error(spot.name,e.detail)});
});

function rad(v){return v*Math.PI/180}
function distanceMeters(lat1,lng1,lat2,lng2){
 const R=6371000,dLat=rad(lat2-lat1),dLng=rad(lng2-lng1);
 const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function showOnlyNearestModel(nearest,nearestDistance){
 const activeId=nearestDistance<=ACTIVE_RADIUS?nearest.id:null;
 spots.forEach(spot=>{
   const entity=document.getElementById(`model-${spot.id}`);
   const isActive=spot.id===activeId;
   entity.setAttribute("visible",isActive);
   if(isActive&&!entity.hasAttribute("gltf-model")){
     states.set(spot.id,"読み込み中");
     entity.setAttribute("gltf-model",spot.model);
   }else if(!isActive&&entity.hasAttribute("gltf-model")){
     entity.removeAttribute("gltf-model");
     entity.removeObject3D("mesh");
     states.set(spot.id,"待機中");
   }
 });
 return activeId;
}

navigator.geolocation.watchPosition(
 p=>{
   const lat=p.coords.latitude,lng=p.coords.longitude,accuracy=p.coords.accuracy;
   let nearest=null,nearestDistance=Infinity;

   spots.forEach(spot=>{
   const d=distanceMeters(lat,lng,spot.lat,spot.lng);
   if(d<nearestDistance){nearestDistance=d;nearest=spot}
 });

   const activeId=showOnlyNearestModel(nearest,nearestDistance);
   const active=activeId?`${nearest.name}:${states.get(activeId)||"準備中"}`:"なし";

   debug.textContent=`現在位置
緯度:${lat.toFixed(8)}
経度:${lng.toFixed(8)}
GPS精度:${accuracy.toFixed(1)} m

最寄り:${nearest?nearest.name:"-"}
距離:${nearestDistance<Infinity?nearestDistance.toFixed(1):"-"} m
設置座標:${nearest?`${nearest.lat}, ${nearest.lng}`:"-"}

300m以内のモデル
${active}`;
 },
 e=>debug.textContent=`位置情報エラー
${e.message}`,
 {enableHighAccuracy:true,maximumAge:0,timeout:15000}
);
</script>
</body>
</html>
