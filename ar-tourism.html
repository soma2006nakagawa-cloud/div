<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>新発田 観光AR 座標固定版</title>
<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#debug{position:fixed;top:10px;left:10px;right:10px;z-index:9999;padding:10px;border-radius:8px;background:rgba(0,0,0,.72);color:#0f0;font-size:13px;line-height:1.45;white-space:pre-line;pointer-events:none}
#back{position:fixed;right:10px;bottom:12px;z-index:9999}
#back button{border:none;border-radius:10px;padding:11px 15px;background:#1976d2;color:#fff;font-size:14px;font-weight:bold}
</style>
</head>
<body>
<div id="debug">GPS取得待機中...</div>
<div id="back"><button onclick="location.href='index.html'">← ホーム</button></div>

<a-scene vr-mode-ui="enabled:false" embedded arjs="sourceType:webcam;gpsMinDistance:5;gpsTimeInterval:1000;debugUIEnabled:false;">
<a-camera gps-camera rotation-reader camera="far:10000;near:0.1"></a-camera>

<a-entity id="model-castle" gps-entity-place="latitude:37.954824724542696;longitude:139.326001834219947;" gltf-model="shibata_jyo.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-zousyunkaku" gps-entity-place="latitude:37.94389807273562;longitude:139.3317142467578;" gltf-model="Zousyunkaku.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-sl" gps-entity-place="latitude:37.94367248807764;longitude:139.3323475293261;" gltf-model="SL.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-oumon" gps-entity-place="latitude:37.94436989072327;longitude:139.33066511399528;" gltf-model="Oumon.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-station" gps-entity-place="latitude:37.94413;longitude:139.33510;" gltf-model="shibata_station.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-menchi" gps-entity-place="latitude:37.93682;longitude:139.34488;" gltf-model="Menchikatsu.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
<a-entity id="model-hellotore" gps-entity-place="latitude:37.95588068;longitude:139.3382848;" gltf-model="hellotore_kun.glb" scale="1 1 1" position="0 2 0" rotation="0 180 0" visible="false"></a-entity>
</a-scene>

<script>
const debug=document.getElementById("debug");
const spots=[
 {id:"castle",name:"新発田城",lat:37.954824724542696,lng:139.326001834219947},
 {id:"zousyunkaku",name:"蔵春閣",lat:37.94389807273562,lng:139.3317142467578},
 {id:"sl",name:"東公園のSL",lat:37.94367248807764,lng:139.3323475293261},
 {id:"oumon",name:"王紋酒造",lat:37.94436989072327,lng:139.33066511399528},
 {id:"station",name:"新発田駅",lat:37.94413,lng:139.33510},
 {id:"menchi",name:"五十公野メンチカツや",lat:37.93682,lng:139.34488},
 {id:"hellotore",name:"新潟職業能力開発短期大学校",lat:37.95588068,lng:139.3382848}
];
const ACTIVE_RADIUS=300;
const states=new Map();

spots.forEach(spot=>{
 const entity=document.getElementById(`model-${spot.id}`);
 states.set(spot.id,"読み込み中");
 entity.addEventListener("model-loaded",()=>states.set(spot.id,"読込成功"));
 entity.addEventListener("model-error",e=>{
   states.set(spot.id,"読込失敗");
   console.error(spot.name,e.detail);
 });
});

function rad(value){return value*Math.PI/180}
function distanceMeters(lat1,lng1,lat2,lng2){
 const R=6371000;
 const dLat=rad(lat2-lat1);
 const dLng=rad(lng2-lng1);
 const a=Math.sin(dLat/2)**2+Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
 return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function showOnlyNearestModel(nearest,nearestDistance){
 const activeId=nearest&&nearestDistance<=ACTIVE_RADIUS?nearest.id:null;
 spots.forEach(spot=>{
   document.getElementById(`model-${spot.id}`).setAttribute("visible",spot.id===activeId);
 });
 return activeId;
}

navigator.geolocation.watchPosition(
 p=>{
   const lat=p.coords.latitude;
   const lng=p.coords.longitude;
   const accuracy=p.coords.accuracy;
   let nearest=null;
   let nearestDistance=Infinity;

   spots.forEach(spot=>{
     const distance=distanceMeters(lat,lng,spot.lat,spot.lng);
     if(distance<nearestDistance){
       nearestDistance=distance;
       nearest=spot;
     }
   });

   const activeId=showOnlyNearestModel(nearest,nearestDistance);
   const active=activeId?`${nearest.name}:${states.get(activeId)||"準備中"}`:"なし";

   debug.textContent=`現在位置
緯度:${lat.toFixed(8)}
経度:${lng.toFixed(8)}
GPS精度:${accuracy.toFixed(1)} m

最寄り:${nearest?nearest.name:"-"}
距離:${nearestDistance<Infinity?nearestDistance.toFixed(1):"-"} m
設置座標:${nearest?`${nearest.lat}, ${nearest.lng}`:"-"}

300m以内のモデル
${active}`;
 },
 e=>debug.textContent=`位置情報エラー\n${e.message}`,
 {enableHighAccuracy:true,maximumAge:0,timeout:15000}
);
</script>
</body>
</html>
