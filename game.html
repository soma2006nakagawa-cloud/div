<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>職短 ハロトレくん ARテスト</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#debug{
  position:fixed;top:10px;left:10px;right:10px;z-index:9999;
  padding:10px;background:rgba(0,0,0,.72);color:#00ff66;
  border-radius:8px;white-space:pre-line;font-size:13px;line-height:1.45;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="debug">GPS・モデル取得待機中...</div>

<a-scene
  vr-mode-ui="enabled:false"
  embedded
  arjs="sourceType:webcam;gpsMinDistance:0;gpsTimeInterval:1000;debugUIEnabled:false;">

  <a-camera
    gps-camera
    rotation-reader
    camera="far:10000;near:0.1">
  </a-camera>

  <!-- 新潟職業能力開発短期大学校：ハロトレくん -->
  <a-entity
    id="hellotore"
    gps-entity-place="latitude:37.95588068; longitude:139.3382848;"
    gltf-model="hellotore_kun.glb"
    position="0 2 0"
    scale="0.2 0.2 0.2"
    rotation="0 180 0">
  </a-entity>

</a-scene>

<script>
const debug = document.getElementById("debug");
const model = document.getElementById("hellotore");

let modelState = "hellotore_kun.glb 読み込み中...";

model.addEventListener("model-loaded", () => {
  modelState = "hellotore_kun.glb 読み込み成功";
});

model.addEventListener("model-error", e => {
  modelState = "hellotore_kun.glb 読み込み失敗";
  console.error("model-error", e.detail);
});

function rad(v){ return v * Math.PI / 180; }

function distanceMeters(lat1,lng1,lat2,lng2){
  const R=6371000;
  const dLat=rad(lat2-lat1);
  const dLng=rad(lng2-lng1);
  const a=
    Math.sin(dLat/2)**2 +
    Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

navigator.geolocation.watchPosition(
  p => {
    const lat=p.coords.latitude;
    const lng=p.coords.longitude;
    const dist=distanceMeters(lat,lng,37.95588068,139.3382848);

    debug.textContent =
`現在位置
緯度:${lat.toFixed(8)}
経度:${lng.toFixed(8)}
GPS精度:${p.coords.accuracy.toFixed(1)} m
職短まで:${dist.toFixed(1)} m
${modelState}`;
  },
  e => {
    debug.textContent="位置情報エラー: "+e.message;
  },
  {
    enableHighAccuracy:true,
    maximumAge:0,
    timeout:15000
  }
);
</script>

</body>
</html>
